# Local Postgres for development and tests. Production will use Neon (same Postgres, different DATABASE_URL).
name: petcare-medication-tracker
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare
    ports:
      # 5434 on the host: 5432 is taken by a local Postgres and 5433 by another project's container.
      - "5434:5432"
    volumes:
      - petcare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  petcare-db:
